buildscript {
 repositories { maven { url='https://maven.minecraftforge.net/' }; mavenCentral() }
 dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:3.+' }
}
apply plugin:'net.minecraftforge.gradle'
version='0.1.0'
group='com.nanonaitor.banking'
archivesBaseName='banking-villagers-1.12.2'
sourceCompatibility=targetCompatibility='1.8'
minecraft { mappings channel:'snapshot',version:'20171003-1.12'; runs { client { workingDirectory project.file('run'); if(project.hasProperty('clientSmokeTest')) property 'banking.clientSmokeTest','true' } } }
dependencies { minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860' }
jar.finalizedBy('reobfJar')
task storageTest(type:JavaExec,dependsOn:testClasses){classpath=sourceSets.test.runtimeClasspath;main='com.nanonaitor.banking.StorageTest'}
check.dependsOn storageTest
